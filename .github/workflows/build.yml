name: Android and learning logic
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :android:testReleaseUnitTest :android:assembleRelease :android:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-universal-apk
          path: android/build/outputs/apk/release/android-release-unsigned.apk
          retention-days: 7
